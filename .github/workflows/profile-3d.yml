name: GitHub-Profile-3D-Contrib

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: youngsilver-kim

      - name: Make soft pink 3D theme
        run: |
          python - << 'PY'
          from pathlib import Path
          import re

          out_dir = Path("profile-3d-contrib")
          preferred = [
              out_dir / "profile-gitblock.svg",
              out_dir / "profile-night-view.svg",
              out_dir / "profile-night-green.svg",
              out_dir / "profile-green.svg",
              out_dir / "profile-green-animate.svg",
              out_dir / "profile-season.svg",
              out_dir / "profile-night-rainbow.svg",
          ]

          src = None
          for p in preferred:
              if p.exists():
                  src = p
                  break

          if src is None:
              svgs = list(out_dir.glob("*.svg"))
              if not svgs:
                  raise SystemExit("No SVG generated.")
              src = svgs[0]

          text = src.read_text(encoding="utf-8")

          # 1) 배경/텍스트 먼저 차분하게
          bg_map = {
              "#0d1117": "#f3dce9",
              "#161b22": "#f3dce9",
              "#ffffff": "#fff7fb",
              "#fff": "#fff7fb",
              "#000000": "#7f6179",
              "#000": "#7f6179",
              "#ebedf0": "#e8bfd5",
              "#c9d1d9": "#c79ab3",
              "#8b949e": "#9b738d"
          }
          for old, new in bg_map.items():
              text = text.replace(old, new)

          # 2) 원색들을 "3D 핑크 계열 4톤"으로 분리
          # 윗면 / 밝은면 / 중간면 / 그림자면 느낌
          tone_map = {
              # red family
              "#ff0000": "#ff6fb3",
              "#e74c3c": "#ff6fb3",
              "red": "#ff6fb3",

              # blue family
              "#0000ff": "#e889c2",
              "#58a6ff": "#e889c2",
              "#79c0ff": "#e889c2",
              "blue": "#e889c2",

              # green family
              "#00ff00": "#c85d96",
              "#39d353": "#c85d96",
              "#26a641": "#c85d96",
              "#0e4429": "#9f3f72",
              "#216e39": "#9f3f72",
              "green": "#c85d96",

              # yellow/orange family
              "#ffff00": "#f7a8d0",
              "#ffa657": "#f7a8d0",
              "yellow": "#f7a8d0",
              "orange": "#f7a8d0",

              # purple/cyan just in case
              "purple": "#d978ad",
              "cyan": "#d978ad"
          }

          for old, new in tone_map.items():
              text = re.sub(re.escape(old), new, text, flags=re.IGNORECASE)

          # 3) hex 색들을 너무 형광이 아니게 핑크 계열로 보정
          def recolor_hex(match):
              token = match.group(0).lower()
              preserve = {
                  "#f3dce9", "#fff7fb", "#7f6179", "#e8bfd5", "#c79ab3", "#9b738d",
                  "#ff6fb3", "#e889c2", "#c85d96", "#9f3f72", "#f7a8d0", "#d978ad"
              }
              if token in preserve:
                  return token
              # 나머지 강한 색은 중간 핑크로 통일
              return "#d978ad"

          text = re.sub(r'#[0-9a-fA-F]{3,6}', recolor_hex, text)

          # 4) rgb(...)도 남아 있으면 중간톤 핑크로
          text = re.sub(r'rgb\([^)]*\)', 'rgb(217,120,173)', text)

          out = out_dir / "profile-pink-forced.svg"
          out.write_text(text, encoding="utf-8")
          print(f"Created {out} from {src}")
          PY

      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "update soft pink 3d graph" || echo "no changes"
          git push
