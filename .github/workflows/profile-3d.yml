name: GitHub-Profile-3D-Contrib

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: youngsilver-kim

      - name: Force pink theme for SVG
        run: |
          python - << 'PY'
          from pathlib import Path
          import re
          import colorsys

          out_dir = Path("profile-3d-contrib")
          candidates = [
              out_dir / "profile-gitblock.svg",
              out_dir / "profile-night-rainbow.svg",
              out_dir / "profile-night-view.svg",
              out_dir / "profile-night-green.svg",
              out_dir / "profile-green.svg",
              out_dir / "profile-green-animate.svg",
          ]

          src = None
          for p in candidates:
              if p.exists():
                  src = p
                  break

          if src is None:
              raise SystemExit("No source SVG found.")

          text = src.read_text(encoding="utf-8")

          def hex_to_rgb(h):
              h = h.lstrip("#")
              if len(h) == 3:
                  h = "".join(c * 2 for c in h)
              return tuple(int(h[i:i+2], 16) for i in (0, 2, 4))

          def rgb_to_hex(rgb):
              return "#{:02x}{:02x}{:02x}".format(*rgb)

          def pinkify(rgb):
              r, g, b = rgb
              h, s, v = colorsys.rgb_to_hsv(r / 255, g / 255, b / 255)

              # 흰색/회색/검정은 거의 유지
              if s < 0.12:
                  # 회색은 약간 핑크 회색으로
                  avg = int((r + g + b) / 3)
                  if avg > 235:
                      return (255, 250, 252)
                  if avg < 40:
                      return (58, 36, 56)
                  return (min(255, avg + 18), max(0, avg - 8), min(255, avg + 12))

              # 채도 있는 색은 모두 핑크 hue로 강제 이동
              new_h = 325 / 360.0
              new_s = max(0.45, min(0.85, s))
              new_v = max(0.55, min(1.0, v))
              nr, ng, nb = colorsys.hsv_to_rgb(new_h, new_s, new_v)
              return (round(nr * 255), round(ng * 255), round(nb * 255))

          # 1) #RRGGBB / #RGB 치환
          hex_pattern = re.compile(r'#[0-9a-fA-F]{3,6}')
          def replace_hex(m):
              token = m.group(0)
              try:
                  rgb = hex_to_rgb(token)
              except Exception:
                  return token
              return rgb_to_hex(pinkify(rgb))
          text = hex_pattern.sub(replace_hex, text)

          # 2) rgb(r,g,b) 치환
          rgb_pattern = re.compile(r'rgb\(\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})\s*,\s*([0-9]{1,3})\s*\)')
          def replace_rgb(m):
              rgb = tuple(int(m.group(i)) for i in range(1, 4))
              nr, ng, nb = pinkify(rgb)
              return f"rgb({nr},{ng},{nb})"
          text = rgb_pattern.sub(replace_rgb, text)

          # 3) 남는 대표 원색 직접 강제 치환
          hard_replace = {
              "red": "#ff69b4",
              "blue": "#c86bff",
              "green": "#ff85c8",
              "yellow": "#ffd1ea",
              "#ff0000": "#ff4fa3",
              "#00ff00": "#ff85c8",
              "#0000ff": "#c86bff",
              "#ffff00": "#ffd1ea",
              "#39d353": "#ff69b4",
              "#26a641": "#ff85c8",
              "#0e4429": "#8e4a88",
              "#58a6ff": "#c86bff",
              "#ffa657": "#ff9ad5",
              "#f778ba": "#ff69b4",
              "#ebedf0": "#f7d6f2",
              "#ffffff": "#fffafc",
              "#000000": "#3a2438"
          }
          for old, new in hard_replace.items():
              text = text.replace(old, new)

          out = out_dir / "profile-pink-forced.svg"
          out.write_text(text, encoding="utf-8")
          print(f"Created {out} from {src}")
          PY

      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "update pink graph" || echo "no changes"
          git push
