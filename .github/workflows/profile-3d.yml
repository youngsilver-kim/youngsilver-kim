name: GitHub-Profile-3D-Contrib

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: youngsilver-kim

      - name: Force full pink theme
        run: |
          python - << 'PY'
          from pathlib import Path
          import re

          out_dir = Path("profile-3d-contrib")
          if not out_dir.exists():
              raise SystemExit("profile-3d-contrib directory not found")

          # 원본 SVG 선택
          preferred = [
              out_dir / "profile-gitblock.svg",
              out_dir / "profile-night-view.svg",
              out_dir / "profile-night-green.svg",
              out_dir / "profile-green.svg",
              out_dir / "profile-green-animate.svg",
              out_dir / "profile-season.svg",
              out_dir / "profile-season-animate.svg",
              out_dir / "profile-south-season.svg",
              out_dir / "profile-south-season-animate.svg",
              out_dir / "profile-night-rainbow.svg",
          ]

          src = None
          for p in preferred:
              if p.exists():
                  src = p
                  break

          if src is None:
              svgs = list(out_dir.glob("*.svg"))
              if not svgs:
                  raise SystemExit("No SVG generated in profile-3d-contrib/")
              src = svgs[0]

          text = src.read_text(encoding="utf-8")

          # -----------------------------
          # 1) CSS class / style 내부 색 전부 핑크화
          # -----------------------------
          # HEX 색상 전부 강제 치환
          text = re.sub(r'#[0-9a-fA-F]{3,6}', '#ff69b4', text)

          # rgb(...) 전부 강제 치환
          text = re.sub(r'rgb\([^)]*\)', 'rgb(255,105,180)', text)

          # 이름 색상 전부 강제 치환
          color_name_map = {
              "red": "#ff69b4",
              "blue": "#ff69b4",
              "green": "#ff69b4",
              "yellow": "#ff69b4",
              "orange": "#ff69b4",
              "purple": "#ff69b4",
              "cyan": "#ff69b4",
              "lime": "#ff69b4"
          }
          for old, new in color_name_map.items():
              text = re.sub(rf'\b{old}\b', new, text, flags=re.IGNORECASE)

          # -----------------------------
          # 2) 회색/검정/흰색 계열은 예쁘게 다시 지정
          # -----------------------------
          special_replacements = {
              "#ff69b4": "#ff69b4",
              "#000000": "#5c3a57",
              "#ffffff": "#fff8fc"
          }
          for old, new in special_replacements.items():
              text = text.replace(old, new)

          # 바닥선/축/라벨이 너무 진하면 부드럽게
          soft_map = {
              "#5c3a57": "#c89abc",
              "#fff8fc": "#fff8fc"
          }
          for old, new in soft_map.items():
              text = text.replace(old, new)

          # -----------------------------
          # 3) 블록 면(face) 다양성 주기: 핑크 계열 3톤으로 분산
          # -----------------------------
          # 전부 같은 핑크면 너무 납작해 보여서 약간 다른 핑크톤 추가
          pink_shades = ["#ff4fa3", "#ff69b4", "#ff8fc7"]
          idx = 0

          def cycle_pink(match):
              nonlocal_idx = cycle_pink.counter
              color = pink_shades[nonlocal_idx % len(pink_shades)]
              cycle_pink.counter += 1
              return color
          cycle_pink.counter = 0

          # 이미 핑크로 바뀐 색들 일부를 3톤으로 분산
          text = re.sub(r'#ff69b4', cycle_pink, text)

          # 배경은 너무 핑크가 되면 지저분하니 다시 연회색-핑크로 보정
          text = text.replace("#ff4fa3", "#f2dbe9", 2)   # 상단 배경 일부
          text = text.replace("#ff69b4", "#e7cddd", 2)   # 배경 일부
          text = text.replace("#ff8fc7", "#d8b8cf", 2)   # 배경 일부

          out = out_dir / "profile-pink-forced.svg"
          out.write_text(text, encoding="utf-8")
          print(f"Created {out} from {src}")
          PY

      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "update pink graph" || echo "no changes"
          git push
